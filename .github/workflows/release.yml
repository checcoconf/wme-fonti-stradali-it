# .github/workflows/release.yml
# Versionamento MANUALE: la versione la decidi tu nella riga "// @version" dello script.
# A ogni push su main la Action la legge: se quel numero non e' mai stato rilasciato,
# pubblica la release v<versione>; se esiste gia', non fa nulla (alza @version per pubblicare).
#
# Nota sui file in data/: sono agganciati allo script con @resource e Tampermonkey li
# riscarica quando lo script si aggiorna. Se correggi solo un JSON, alza comunque @version,
# altrimenti chi ha gia' lo script installato continua a usare la copia vecchia.

name: Release userscript

on:
  push:
    branches: [main]
    paths:
      - 'wme-fonti-stradali-it.user.js'
      - 'data/**.json'
  workflow_dispatch:

permissions:
  contents: write   # serve per creare tag e release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con tutti i tag (per capire se la versione e' gia' uscita)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leggi la versione dalla riga @version dello script
        id: ver
        run: |
          V=$(grep -m1 -E "^// @version" wme-fonti-stradali-it.user.js | sed -E "s|^// @version[[:space:]]+||" | tr -d "[:space:]")
          if [ -z "$V" ]; then echo "::error::riga @version non trovata nello script"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Versione nel file: $V"

      - name: La versione e' gia' stata rilasciata?
        id: chk
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.ver.outputs.version }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.ver.outputs.version }} gia' esistente: nessuna release. Alza @version nello script per pubblicare."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verifica sintassi
        if: steps.chk.outputs.exists == 'false'
        run: node --check wme-fonti-stradali-it.user.js

      - name: Verifica i file dati (JSON valido + campi attesi)
        if: steps.chk.outputs.exists == 'false'
        run: |
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync("data/comuni.json", "utf8"));
            const n = Object.keys(c.comuni || {}).length;
            if (n < 7000) throw new Error("data/comuni.json: solo " + n + " comuni");
            for (const k of Object.keys(c.comuni)) {
              if (!/^[A-Z]\d{3}$/.test(k)) throw new Error("codice catastale non valido: " + k);
            }
            const o = JSON.parse(fs.readFileSync("data/odonimi.json", "utf8"));
            for (const campo of ["abbreviazioni", "minuscole", "particelleCognome", "romaniAmbigui"]) {
              if (!o[campo]) throw new Error("data/odonimi.json: manca " + campo);
            }
            console.log("comuni: " + n + " \u00b7 odonimi: ok");
          '

      - name: Le risorse @resource puntano a file che esistono davvero?
        if: steps.chk.outputs.exists == 'false'
        run: |
          grep -E "^// @resource" wme-fonti-stradali-it.user.js | awk '{print $4}' | while read -r U; do
            F=${U##*/main/}
            if [ ! -f "$F" ]; then echo "::error::@resource punta a $U ma $F non esiste nel repo"; exit 1; fi
            echo "ok $F"
          done

      - name: Genera il .meta.js (solo metadati, per il check aggiornamenti)
        if: steps.chk.outputs.exists == 'false'
        run: awk '/==UserScript==/,/==\/UserScript==/' wme-fonti-stradali-it.user.js > wme-fonti-stradali-it.meta.js

      - name: Pubblica la release
        if: steps.chk.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body: |
            WME Fonti Stradali IT ${{ steps.ver.outputs.version }}.
          files: |
            wme-fonti-stradali-it.user.js
            wme-fonti-stradali-it.meta.js
            data/comuni.json
            data/odonimi.json